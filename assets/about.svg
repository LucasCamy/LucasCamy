    <path d="M27 116H503" stroke="#273449"/>
    <g font-size="13">
      <text x="27" y="145" fill="#a78bfa" opacity="0">Foco<tspan x="118" fill="#e6edf7">produtos web para problemas reais</tspan><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.2s" fill="freeze"/></text>
      <text x="27" y="173" fill="#a78bfa" opacity="0">Frontend<tspan x="118" fill="#e6edf7">TypeScript · React · Next.js</tspan><animate attributeName="opacity" from="0" to="1" begin="0.68s" dur="0.2s" fill="freeze"/></text>
      <text x="27" y="201" fill="#a78bfa" opacity="0">Backend<tspan x="118" fill="#e6edf7">C# · ASP.NET Core · APIs</tspan><animate attributeName="opacity" from="0" to="1" begin="0.86s" dur="0.2s" fill="freeze"/></text>
      <text x="27" y="229" fill="#a78bfa" opacity="0">Dados<tspan x="118" fill="#e6edf7">PostgreSQL · integrações</tspan><animate attributeName="opacity" from="0" to="1" begin="1.04s" dur="0.2s" fill="freeze"/></text>
    </g>
    <path d="M27 247H503" stroke="#273449"/>
    <text x="27" y="271" fill="#92a4bf" font-size="11" opacity="0">gestão  /  campo  /  automação  /  UX<animate attributeName="opacity" from="0" to="1" begin="1.22s" dur="0.2s" fill="freeze"/></text>
