  <rect width="530" height="300" rx="16" fill="#0b1220"/>
  <rect x="1" y="1" width="528" height="298" rx="15" fill="none" stroke="#273449" stroke-width="2"/>
  <circle cx="23" cy="25" r="5" fill="#fb7185"/><circle cx="41" cy="25" r="5" fill="#fbbf24"/><circle cx="59" cy="25" r="5" fill="#34d399"/>
