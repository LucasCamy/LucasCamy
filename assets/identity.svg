    <text x="37" y="164" opacity="0">██      ██<animate attributeName="opacity" from="0" to="1" begin="0.58s" dur="0.15s" fill="freeze"/></text>
    <text x="37" y="188" opacity="0">██      ██<animate attributeName="opacity" from="0" to="1" begin="0.74s" dur="0.15s" fill="freeze"/></text>
    <text x="37" y="212" opacity="0">███████  ██████<animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.15s" fill="freeze"/></text>
